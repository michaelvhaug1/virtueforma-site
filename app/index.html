<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forma Web - Coming April 2026</title>
  <meta name="description" content="Forma for Web is coming April 2026. Download the iOS app now.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../logo-green.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F7F6F3;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #1B1B1B;
    }
    .subtitle {
      font-size: 18px;
      color: #1F7A4D;
      font-weight: 600;
      margin-bottom: 16px;
    }
    p {
      color: #5C5C5C;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    a.cta {
      display: inline-block;
      background: #1F7A4D;
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    a.cta:hover {
      background: #165C3A;
    }
    .timeline {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid #E5E5E5;
    }
    .timeline h3 {
      font-size: 14px;
      color: #8A8A8A;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .timeline-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
    }
    .timeline-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.live { background: #1F7A4D; }
    .dot.soon { background: #C9A227; }
    .timeline-item span {
      color: #5C5C5C;
    }
    .timeline-item strong {
      color: #1B1B1B;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../logo-green.png" alt="Forma" class="logo">
    <h1>Forma for Web</h1>
    <p class="subtitle">Coming April 2026</p>
    <p>
      We're working hard to bring Forma to your browser.
      In the meantime, download the iOS app to start your faith journey today.
    </p>
    <a href="https://apps.apple.com/app/forma-catholic-habits/id6739592003" class="cta">
      Download for iOS
    </a>

    <div class="timeline">
      <h3>Platform Roadmap</h3>
      <div class="timeline-items">
        <div class="timeline-item">
          <div class="dot live"></div>
          <span><strong>iOS</strong> — Available now</span>
        </div>
        <div class="timeline-item">
          <div class="dot soon"></div>
          <span><strong>Android</strong> — March 2026</span>
        </div>
        <div class="timeline-item">
          <div class="dot soon"></div>
          <span><strong>Web</strong> — April 2026</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
